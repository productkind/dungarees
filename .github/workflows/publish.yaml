# Lives in the monorepo but only runs in the productkind/dungarees mirror, where this folder is the
# root. Publishing from the public mirror is what gets the packages their npm provenance.
#
# Do not rename this file or the environment below. Every @dungarees package names both in its
# trusted publisher configuration, npm matches them exactly, and those configurations cannot be
# edited — only revoked and recreated. A rename means running `npm run trust:dungarees` again for
# all of them, with publishing broken in between.
name: Publish to npm

# The mirror only receives commits that passed the monorepo's Checks, so every push here is ready
# to publish. The publish skips each package whose version is already on the registry.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancel a publish in flight, but never run two at once either.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use an npm that can publish over OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm run publish:libs
